[workspace]
resolver = "2"
members = ["crates/corn-block", "crates/corn-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[workspace.dependencies]
adblock = { version = "0.13.5", default-features = false }
uniffi = "0.32.2"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
