[package]
name = "flush-block"
description = "Corn's wrapper around Brave's adblock-rust engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# default-features off: the default "single-thread" feature makes the engine !Sync,
# but Android WebView checks requests on several threads at once.
adblock = { workspace = true, features = ["embedded-domain-resolver", "full-regex-handling"] }
thiserror.workspace = true
# Already in the dependency tree through adblock-rust; used to build and store scriptlet resources.
base64 = "0.22"
regex = "1"
serde_json = "1"
