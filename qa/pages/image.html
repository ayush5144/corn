<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>QA images</title>
<script src="qa.js"></script>
<body style="font:20px sans-serif;margin:0;padding:16px;background:#fff;color:#111">
<h2 style="margin:0 0 12px">Images</h2>
<p>A plain image (not a link):</p>
<img id="plain" src="picture.png?n=plain" alt="Blue and yellow test picture" style="display:block;width:100%;height:auto">
<p>An image inside a link:</p>
<a id="linked" data-n="image-link"><img id="linkedimg" src="picture.png?n=linked" alt="Linked test picture" style="display:block;width:100%;height:auto"></a>
