<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>QA pop-ups</title>
<script src="qa.js"></script>
<body style="font:20px sans-serif;margin:0;padding:16px;background:#fff;color:#111">
<h2 style="margin:0 0 12px">Pop-up test</h2>
<p><a id="blank" data-n="popup-blank" target="_blank" style="display:block;padding:18px;background:#e8f0fe">1. Link with target=_blank</a></p>
<p><button id="open" style="font-size:20px;padding:18px;width:100%">2. window.open on tap</button></p>
<p><button id="selfclose" style="font-size:20px;padding:18px;width:100%">3. Pop-up that closes itself</button></p>
<p><button id="burst" style="font-size:20px;padding:18px;width:100%">4. One tap, three windows</button></p>
<p id="auto">5. No-tap window.open: only with ?auto=1</p>
<p id="status" style="font-size:14px;color:#555"></p>
<script>
  document.getElementById('open').onclick = function () {
    var w = window.open(QA.hit('popup-open'));
    QA.note('open:' + (w ? 'object' : 'null'));
  };
  document.getElementById('selfclose').onclick = function () {
    var w = window.open('popup-close.html?r=' + encodeURIComponent(QA.run));
    QA.note('selfclose:' + (w ? 'object' : 'null'));
  };
  document.getElementById('burst').onclick = function () {
    var got = [1, 2, 3].map(function (i) { return window.open(QA.hit('popup-burst-' + i)) ? 1 : 0; });
    QA.note('burst:' + got.join(''));
  };
  if (QA.param('auto') === '1') {
    setTimeout(function () {
      var w = window.open(QA.hit('popup-auto'));
      window.qaAutoRan = true;
      document.getElementById('auto').textContent = '5. No-tap window.open ran: ' + (w ? 'object' : 'null');
    }, 3000);
  }
</script>
