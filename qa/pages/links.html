<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>QA link titles</title>
<script src="qa.js"></script>
<body style="font:20px sans-serif;margin:0;padding:16px;background:#fff;color:#111">
<h2 style="margin:0 0 12px">Video list (like YouTube)</h2>
<!-- The thumbnail link's first text is the duration overlay; the real title is a second link
     to the same address. Long-pressing the thumbnail should show the title, not "4:02". -->
<div style="position:relative">
  <a id="thumb" data-n="video-1" style="display:block;position:relative">
    <span id="duration" style="position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:14px;padding:2px 6px;border-radius:4px">4:02</span>
    <img src="picture.png?n=thumb" alt="" style="display:block;width:100%;height:auto">
  </a>
</div>
<a id="title" data-n="video-1" style="display:block;padding:10px 0;color:#111;text-decoration:none;font-weight:bold">Sunrise over a quiet lake</a>

<h2 style="margin:24px 0 8px">A search result</h2>
<p>Like a search engine's result: a tiny embedded site icon inside the same link as the heading.</p>
<a id="result" data-n="result-1" style="display:block;color:#1a0dab;text-decoration:none;padding:8px 0">
  <span style="display:flex;align-items:center;gap:8px;color:#333;font-size:14px"><img id="resulticon" width="27" height="27" alt="" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" style="border-radius:50%;background:#ddd">example.org · Quiet Kitchen · 1.2K followers</span>
  <h3 style="margin:6px 0 0;font-size:22px">Twelve quiet weeknight recipes</h3>
</a>
